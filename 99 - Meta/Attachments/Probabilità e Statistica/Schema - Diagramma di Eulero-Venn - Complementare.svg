<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <filter id="glow-complementare" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="15" y="15" width="770" height="450" rx="24" fill="#141820" stroke="#2a3242" stroke-width="2"/>
  
  <!-- Header Bar -->
  <text x="45" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SPAZIO AMBIENTE</text>
  <text x="400" y="52" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Complementare di un Insieme (A^∁)</text>
  <text x="750" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700" text-anchor="end">Ω</text>
  <line x1="35" y1="70" x2="765" y2="70" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Shaded Area Outside Circle A (EvenOdd Rule) -->
  <path d="M 35 85 H 765 V 385 H 35 Z M 400 95 A 135 135 0 1 0 400 365 A 135 135 0 1 0 400 95 Z" 
        fill-rule="evenodd" fill="rgba(168, 85, 247, 0.28)" filter="url(#glow-complementare)"/>
  
  <!-- Circle A Outline & Interior -->
  <circle cx="400" cy="230" r="135" fill="#141820" stroke="#38bdf8" stroke-width="3.5"/>

  <!-- Labels -->
  <text x="400" y="240" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="700" text-anchor="middle">A</text>
  <text x="650" y="160" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="800" text-anchor="middle">A^∁</text>
  <text x="650" y="190" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" text-anchor="middle">(Ω \ A)</text>

  <!-- Footer Formula Bar -->
  <line x1="35" y1="395" x2="765" y2="395" stroke="#1f293d" stroke-width="1.5"/>
  <text x="400" y="423" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">A^∁ := Ω \ A = { x ∈ Ω | x ∉ A }</text>
  <text x="400" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" text-anchor="middle">Tutti gli elementi dello spazio ambiente che non appartengono ad A</text>
</svg>