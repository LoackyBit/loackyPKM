<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <filter id="glow-unione" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="15" y="15" width="770" height="450" rx="24" fill="#141820" stroke="#2a3242" stroke-width="2"/>
  
  <!-- Header Bar -->
  <text x="45" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SPAZIO AMBIENTE</text>
  <text x="400" y="52" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Unione di Insiemi (A ∪ B)</text>
  <text x="750" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700" text-anchor="end">Ω</text>
  <line x1="35" y1="70" x2="765" y2="70" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Union Highlight Fill (both circles merged) -->
  <g filter="url(#glow-unione)">
    <circle cx="330" cy="235" r="135" fill="rgba(245, 158, 11, 0.32)"/>
    <circle cx="470" cy="235" r="135" fill="rgba(245, 158, 11, 0.32)"/>
  </g>
  
  <!-- Circles Outlines -->
  <circle cx="330" cy="235" r="135" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="470" cy="235" r="135" fill="none" stroke="#c084fc" stroke-width="3.5"/>

  <!-- Labels -->
  <text x="250" y="165" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700">A</text>
  <text x="540" y="165" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700">B</text>
  <text x="400" y="243" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" text-anchor="middle" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))">A ∪ B</text>

  <!-- Footer Formula Bar -->
  <line x1="35" y1="395" x2="765" y2="395" stroke="#1f293d" stroke-width="1.5"/>
  <text x="400" y="423" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">A ∪ B := { x ∈ Ω | x ∈ A ∨ x ∈ B }</text>
  <text x="400" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" text-anchor="middle">Tutti gli elementi che appartengono ad A, a B o a entrambi</text>
</svg>